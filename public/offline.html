<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Offline — Templo Uno Corp ERP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      text-align: center;
      max-width: 320px;
      padding: 40px 32px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 20px;
    }
    .logo {
      width: 56px;
      height: 56px;
      background: #EAB308;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 20px;
      font-weight: 900;
      color: #000;
      letter-spacing: -1px;
    }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: #71717a; line-height: 1.6; margin-bottom: 24px; }
    button {
      background: #EAB308;
      color: #000;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #ca9f06; }
    .status {
      margin-top: 20px;
      font-size: 12px;
      color: #52525b;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">TU</div>
    <h1>Sem conexão</h1>
    <p>O Templo Uno Corp ERP está funcionando offline. Algumas funcionalidades podem estar limitadas até a conexão ser restabelecida.</p>
    <button onclick="window.location.reload()">Tentar novamente</button>
    <div class="status">
      <span class="dot"></span>Sem internet
    </div>
  </div>
  <script>
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
